<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="900" role="img" aria-label="How we work: idea, strategy, design, build, launch">
  <style>
    .s{fill:none;stroke:#1E3A4C;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 13s ease-in-out infinite;animation-delay:var(--d,0s)}
    g.s{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
    g.s path,g.s circle{fill:none;stroke:#1E3A4C;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 13s ease-in-out infinite;animation-delay:var(--d,0s)}
    .f{opacity:0;animation:fade 13s ease-in-out infinite;animation-delay:var(--d,0s)}
    text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#1E3A4C}
    .n{font-size:14px;font-weight:700;letter-spacing:3px}
    .t{font-size:28px;font-weight:800}
    .u{font-size:15px;font-weight:500}
    @keyframes draw{0%{stroke-dashoffset:1}9%{stroke-dashoffset:0}90%{stroke-dashoffset:0}97%,100%{stroke-dashoffset:1}}
    @keyframes fade{0%{opacity:0}7%{opacity:1}90%{opacity:1}97%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.s,g.s path,g.s circle{animation:none;stroke-dashoffset:0}.f{animation:none;opacity:1}}
  </style>
